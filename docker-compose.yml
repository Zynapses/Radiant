# RADIANT Local Development Stack
# Run with: docker-compose up -d

version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: radiant-postgres
    environment:
      POSTGRES_USER: radiant
      POSTGRES_PASSWORD: radiant_dev_password
      POSTGRES_DB: radiant_dev
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./packages/infrastructure/migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U radiant -d radiant_dev"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis (for caching and sessions)
  redis:
    image: redis:7-alpine
    container_name: radiant-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # LocalStack (AWS services emulation)
  localstack:
    image: localstack/localstack:latest
    container_name: radiant-localstack
    ports:
      - "4566:4566"
      - "4510-4559:4510-4559"
    environment:
      - SERVICES=s3,secretsmanager,cognito-idp,lambda
      - DEBUG=0
      - DATA_DIR=/var/lib/localstack/data
      - DOCKER_HOST=unix:///var/run/docker.sock
    volumes:
      - localstack_data:/var/lib/localstack
      - /var/run/docker.sock:/var/run/docker.sock

  # pgAdmin (Database GUI)
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: radiant-pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@radiant.local
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "5050:80"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    depends_on:
      - postgres

  # OMEGA vLLM Server (Neural Bridge - The Mouth)
  # Custom FastAPI wrapper with vector injection support
  # GPU required for production; CPU mode for local dev (slow but functional)
  vllm:
    build:
      context: ./infrastructure/docker/vllm
      dockerfile: Dockerfile
    container_name: radiant-vllm
    environment:
      - VLLM_MODEL=${VLLM_MODEL:-meta-llama/Meta-Llama-3-8B-Instruct}
      - VLLM_DEVICE=${VLLM_DEVICE:-auto}
      - VLLM_DTYPE=${VLLM_DTYPE:-auto}
      - VLLM_GPU_UTIL=0.85
      - VLLM_MAX_MODEL_LEN=4096
      - VLLM_PORT=8100
      - SOFT_TOKEN_DIM=4096
      - HF_TOKEN=${HF_TOKEN:-}
    ports:
      - "8100:8100"
    volumes:
      - vllm_models:/root/.cache/huggingface
      - omega_state:/mnt/omega_state
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    profiles:
      - gpu
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8100/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 120s

volumes:
  postgres_data:
  redis_data:
  localstack_data:
  pgadmin_data:
  vllm_models:
  omega_state:

networks:
  default:
    name: radiant-network
