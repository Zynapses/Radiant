[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "radiant-omega"
version = "0.2.0"
description = "OMEGA Core — Bicameral Synthetic Biological Intelligence Engine"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "Proprietary"}
authors = [{name = "RADIANT Engineering"}]

dependencies = [
    "torch>=2.0",
]

[project.optional-dependencies]
dev = ["pytest", "mypy"]

[tool.setuptools.packages.find]
where = ["."]
include = ["radiant_omega*"]
